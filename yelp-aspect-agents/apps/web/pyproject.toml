[project]
name = "yelp-web"
version = "0.1.0"
description = "Web UI + API for the Yelp aspect-agent team (all scoring happens in Python)"
requires-python = ">=3.10"
dependencies = ["yelp-core", "yelp-scoring", "yelp-data", "yelp-agents", "yelp-eval", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
yelp-web = "yelp_web.server:main"

[tool.uv.sources]
yelp-core = { workspace = true }
yelp-scoring = { workspace = true }
yelp-data = { workspace = true }
yelp-agents = { workspace = true }
yelp-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_web"]
