[project]
name = "yelp-cli"
version = "0.1.0"
description = "Command-line entry point for the pipeline"
requires-python = ">=3.10"
dependencies = ["yelp-core", "yelp-data", "yelp-agents", "yelp-eval"]

[project.scripts]
yelp-agents = "yelp_cli.main:main"

[tool.uv.sources]
yelp-core = { workspace = true }
yelp-data = { workspace = true }
yelp-agents = { workspace = true }
yelp-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_cli"]
