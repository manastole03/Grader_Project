[project]
name = "yelp-scoring"
version = "0.1.0"
description = "Deterministic Python scoring: quote grounding, aspect/overall scores, cross-validated star model"
requires-python = ">=3.10"
dependencies = ["yelp-core", "numpy>=1.26", "scikit-learn>=1.4"]

[tool.uv.sources]
yelp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_scoring"]
