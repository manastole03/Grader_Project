[project]
name = "yelp-core"
version = "0.1.0"
description = "Shared schemas, config and LLM provider clients (NVIDIA NIM / HF / Ollama / mock)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_core"]
