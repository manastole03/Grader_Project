[project]
name = "yelp-data"
version = "0.1.0"
description = "Streams and samples reviews straight out of the Yelp dataset tar"
requires-python = ">=3.10"
dependencies = ["yelp-core"]

[tool.uv.sources]
yelp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_data"]
