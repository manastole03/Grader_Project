[project]
name = "yelp-agents"
version = "0.1.0"
description = "Aspect agents (food, service, ambience), aggregator agent and orchestrator"
requires-python = ">=3.10"
dependencies = ["yelp-core", "yelp-scoring"]

[tool.uv.sources]
yelp-core = { workspace = true }
yelp-scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_agents"]
