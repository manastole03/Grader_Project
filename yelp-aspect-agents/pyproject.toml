[project]
name = "yelp-aspect-agents"
version = "0.1.0"
description = "Multi-agent, 3-dimensional (food / service / ambience) sentiment analysis over Yelp reviews, scored in Python"
requires-python = ">=3.10"
dependencies = ["yelp-core", "yelp-scoring", "yelp-data", "yelp-agents", "yelp-eval", "yelp-cli", "yelp-web"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
yelp-core = { workspace = true }
yelp-scoring = { workspace = true }
yelp-data = { workspace = true }
yelp-agents = { workspace = true }
yelp-eval = { workspace = true }
yelp-cli = { workspace = true }
yelp-web = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
